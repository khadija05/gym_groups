<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ingia - GYM Zanzibar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}
body{background:#0B0B0F;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.box{width:100%;max-width:440px;background:#16161C;border:1px solid #2A2A32;padding:28px;border-radius:28px}
h2{font-size:clamp(22px,5vw,26px);text-align:center}.sub{text-align:center;color:#888;font-size:13px;margin:6px 0 16px;line-height:1.5}
label{font-size:13px;color:#aaa}
input{width:100%;padding:15px;border:1px solid #333;border-radius:14px;margin:6px 0 12px;background:#111;color:#fff;font-size:16px;outline:none}input:focus{border-color:#FFD400}
.btn{width:100%;padding:15px;border:none;border-radius:999px;font-weight:800;cursor:pointer;font-size:15px;margin-top:6px}.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #333}.btn-green{background:#25D366;color:#fff}.btn:disabled{opacity:.6}
.msg{padding:12px;border-radius:12px;font-size:13px;margin:10px 0;display:none;text-align:center;line-height:1.5;white-space:pre-line}.msg.err{display:block;background:#FF2D0022;color:#FF6B6B;border:1px solid #FF2D00}.msg.ok{display:block;background:#25D36622;color:#25D366;border:1px solid #25D366}
.links{text-align:center;margin-top:14px;font-size:13px;line-height:2}.links a{color:#FFD400;text-decoration:none}
.debug{margin-top:10px;font-size:11px;color:#666;text-align:center;word-break:break-all}
@media(max-width:520px){body{padding:10px;align-items:flex-start}.box{padding:20px 16px;border-radius:22px;margin-top:20px}}
</style></head><body>
<div class="box"><div style="text-align:center;font-size:52px">🔑</div><h2>Karibu Tena</h2><p class="sub">Owner / Admin / Member — ingia uende kwenye Dashboard yako</p>
<label>Username</label><input id="u" placeholder="mfano: khadija05" autocomplete="username">
<label>Password</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
<div id="msg" class="msg"></div>
<button class="btn btn-yellow" id="btn" onclick="doLogin()">Ingia →</button>
<button class="btn btn-green" id="wakeBtn" onclick="wakeBackend()">⏰ Amsha Backend Kwanza (Subiri 50s) →</button>
<button class="btn btn-dark" onclick="location.href='index.html'">← Nyumbani</button>
<div class="links"><a href="register-member.html">Huna akaunti? Jisajili Member →</a></div>
<div id="debug" class="debug"></div></div>
<script>
const API_URL='https://gym-groups.onrender.com';
function showMsg(t,ok=false){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err');}
async function wakeBackend(){
  let b=document.getElementById('wakeBtn'); b.disabled=true; b.textContent='⏳ Inaamsha Backend... subiri 50s';
  showMsg('⏳ Backend ya Render imelala (Free Plan).\nInaamka sasa... Subiri sekunde 50.',true);
  try{ let r=await fetch(API_URL+'/api/health',{cache:'no-store'}); let t=await r.text(); document.getElementById('debug').textContent='Health: '+t.substring(0,200); if(r.ok) showMsg('✅ Backend Imeamka! Sasa bonyeza Ingia.',true); else showMsg('⚠️ Backend: '+t.substring(0,150)); }catch(e){ showMsg('❌ Bado inaamka. Subiri 30s bonyeza tena.'); }
  b.disabled=false; b.textContent='⏰ Amsha Backend Kwanza (Subiri 50s) →';
}
async function doLogin(){
let u=document.getElementById('u').value.trim();
let p=document.getElementById('p').value;
if(!u||!p){showMsg('Jaza username na password');return;}
let btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='⏳ Inaingia...';
document.getElementById('debug').textContent='';
try{
let r=await fetch(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
let txt=await r.text();
document.getElementById('debug').textContent='Status: '+r.status+' | Jibu: '+txt.substring(0,300);
if(txt.trim().startsWith('<')||txt.startsWith('The page')){ showMsg('❌ Backend imelala.\n1. Bonyeza "⏰ Amsha Backend"\n2. Subiri 50s\n3. Bonyeza Ingia tena'); btn.disabled=false; btn.textContent='Ingia →'; return; }
let d={}; try{d=JSON.parse(txt);}catch(e){ showMsg('❌ Backend amerudisha: '+txt.substring(0,200)); btn.disabled=false; btn.textContent='Ingia →'; return; }
if(d.success){
  d.role=(d.role||'MEMBER').toUpperCase();
  localStorage.setItem('gym_user',JSON.stringify(d));
  localStorage.setItem('gym_token','logged-in-'+Date.now());
  showMsg('✅ Karibu '+(d.name||d.username)+'! Inaelekea...',true);
  setTimeout(()=>{ location.href='dashboard.html'; },800); return;
}
showMsg('❌ '+(d.message||'Imeshindikana'));
}catch(e){showMsg('❌ Backend haijapatikana, imelala.\nBonyeza "⏰ Amsha Backend" kwanza, subiri 50s.');}
btn.disabled=false; btn.textContent='Ingia →';
}
document.getElementById('p').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
fetch(API_URL+'/api/health').catch(()=>{});
</script></body></html>
