<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ingia - 💪 GYM ZANZIBAR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system}
body{background:#0B0B0F;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:#FFD400;text-decoration:none}
.top{position:sticky;top:0;z-index:50;background:rgba(11,11,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:19px;font-weight:900;white-space:nowrap}.logo span{color:#FFD400}
.top a{font-size:13px;font-weight:700}
.center{flex:1;display:flex;justify-content:center;align-items:center;padding:20px 14px;background:radial-gradient(600px 300px at 50% 0%,rgba(255,212,0,.12),transparent)}
.box{background:#151515;border:1px solid #2A2A2A;width:100%;max-width:430px;padding:26px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.box-logo{text-align:center;font-size:52px;margin-bottom:6px}
.box h2{text-align:center;font-size:22px}
.box p.sub{text-align:center;color:#999;font-size:13px;margin:6px 0 16px}
.tabs{display:flex;gap:8px;background:#0B0B0F;padding:5px;border-radius:999px;margin-bottom:16px}
.tabs button{flex:1;padding:11px;border:0;border-radius:999px;font-weight:800;cursor:pointer;font-size:14px;background:transparent;color:#aaa;transition:.2s}
.tabs button.active{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}
label{font-size:12px;color:#aaa;font-weight:700;display:block;margin-top:10px}
input,select{width:100%;padding:14px;border:1px solid #333;border-radius:14px;margin:6px 0;font-size:15px;background:#111;color:#fff;outline:none}
input:focus{border-color:#FFD400}
.show-pass{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;margin:4px 0}
.show-pass input{width:auto;margin:0}
.btn{width:100%;padding:15px;border:none;border-radius:999px;font-weight:800;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000;box-shadow:0 8px 20px rgba(255,212,0,.25)}
.btn-green{background:#25D366;color:#fff}
#msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px;color:#ff6b6b}
#msg.ok{color:#22c55e}
.demo{background:#FFF8E1;color:#222;padding:12px;border-radius:14px;font-size:12px;line-height:1.7;margin-top:14px}
.footer{text-align:center;padding:16px;color:#666;font-size:12px;border-top:1px solid #222}
@media(max-width:600px){
  .top{padding:10px 12px}.logo{font-size:17px}
  .center{padding:14px 12px;align-items:flex-start;padding-top:22px}
  .box{padding:20px 16px;border-radius:20px}.box-logo{font-size:44px}.box h2{font-size:20px}
  .tabs button{padding:10px;font-size:13px}input{padding:13px;font-size:16px}.btn{padding:14px;font-size:14px}
}
@media(max-width:360px){.logo{font-size:15px}.box{padding:18px 12px}.box h2{font-size:18px}}
</style>
</head>
<body>
<div class="top"><div class="logo">💪 GYM <span>ZANZIBAR</span></div><a href="/index.html">← Nyumbani</a></div>
<div class="center"><div class="box">
  <div class="box-logo">💪</div>
  <h2>Karibu Tena!</h2>
  <p class="sub">Ingia kuona Dashboard yako — Owner, Admin, Kocha au Member</p>
  <div class="tabs">
    <button id="tLogin" class="active" onclick="showTab('login')">🔑 Ingia</button>
    <button id="tReg" onclick="showTab('reg')">📝 Jisajili</button>
  </div>
  <div id="loginForm">
    <label>NAMBA YA SIMU</label>
    <input id="phone" placeholder="Mfano: 077... / 070..." inputmode="tel">
    <label>PASSWORD</label>
    <input id="pass" type="password" placeholder="Password yako">
    <label class="show-pass"><input type="checkbox" onclick="document.getElementById('pass').type=this.checked?'text':'password'"> Onyesha Password</label>
    <button class="btn btn-yellow" onclick="login()">INGIA →</button>
    <button class="btn btn-green" onclick="location.href='https://wa.me/255887387001?text=Habari!%20Nimesahau%20password%20yangu'">💬 Nimesahau Password?</button>
  </div>
  <div id="regForm" style="display:none">
    <label>JINA KAMILI</label>
    <input id="rName" placeholder="Jina lako kamili">
    <label>NAMBA YA SIMU</label>
    <input id="rPhone" placeholder="077..." inputmode="tel">
    <label>PASSWORD</label>
    <input id="rPass" type="password" placeholder="Tengeneza password">
    <label class="show-pass"><input type="checkbox" onclick="document.getElementById('rPass').type=this.checked?'text':'password'"> Onyesha Password</label>
    <button class="btn btn-yellow" onclick="register()">JISAJILI →</button>
  </div>
  <p id="msg"></p>
</div></div>
<div class="footer">© 2026 Gym Zanzibar • Stone Town • Mjini Magharibi • Forodhani</div>
<script>
const API_URL = window.location.origin;
function showTab(t){
  document.getElementById('loginForm').style.display = t==='login'?'block':'none';
  document.getElementById('regForm').style.display = t==='reg'?'block':'none';
  document.getElementById('tLogin').classList.toggle('active', t==='login');
  document.getElementById('tReg').classList.toggle('active', t==='reg');
  document.getElementById('msg').innerText='';
}
async function login(){
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('pass').value;
  const msg=document.getElementById('msg');
  if(!phone || !password){ msg.innerText='Jaza simu na password'; msg.style.color='#ff6b6b'; return; }
  msg.innerText='Inaingia... ⏳ Subiri sekunde 50 kama server imelala'; msg.style.color='#22c55e';
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 60000);
    const r=await fetch(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password}),signal:controller.signal});
    clearTimeout(timeout);
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ msg.innerText=d.error||d.message||('Error: '+r.status); msg.style.color='#ff6b6b'; return; }
    const user = d.user || d;
    localStorage.setItem('token',d.token);
    localStorage.setItem('user',JSON.stringify(user));
    localStorage.setItem('role',user.role||'');
    if(user.gymId) localStorage.setItem('gymId',user.gymId);
    msg.innerText='✅ Umeingia! Inakupeleka...'; msg.style.color='#22c55e';
    setTimeout(()=>{
      if(user.role) user.role = user.role.toLowerCase();
      if(user.role==='trainer') user.role='coach';
      localStorage.setItem('user', JSON.stringify(user));
      localStorage.setItem('role', user.role);
      location.href='/dashboard.html';
    },700);
  }catch(e){ msg.innerText='Server bado haijaamka. Subiri sekunde 60, refresh ukurasa, jaribu tena.'; msg.style.color='#ff6b6b'; }
}
async function register(){
  const fullName=document.getElementById('rName').value.trim();
  const phone=document.getElementById('rPhone').value.trim();
  const password=document.getElementById('rPass').value;
  const msg=document.getElementById('msg');
  if(!fullName || !phone || !password){ msg.innerText='Jaza taarifa zote'; msg.style.color='#ff6b6b'; return; }
  msg.innerText='Inajisajili... ⏳'; msg.style.color='#22c55e';
  try{
    const r=await fetch(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName,phone,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ msg.innerText=d.error||d.message||'Imeshindikana kujisajili'; msg.style.color='#ff6b6b'; return; }
    msg.innerText='✅ Umejisajili! Ingia sasa'; msg.style.color='#22c55e';
    showTab('login'); document.getElementById('phone').value=phone;
  }catch(e){ msg.innerText='Server bado haijaamka. Subiri sekunde 60, refresh, jaribu tena.'; msg.style.color='#ff6b6b'; }
}
document.getElementById('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
document.getElementById('rPass').addEventListener('keydown',e=>{ if(e.key==='Enter') register(); });
</script>
</body>
</html>
