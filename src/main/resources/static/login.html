<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingia - GYM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}
body{background:#0B0B0F;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.box{width:100%;max-width:440px;background:#16161C;border:1px solid #2A2A32;padding:28px;border-radius:28px}
h2{font-size:26px;text-align:center} .sub{text-align:center;color:#888;font-size:13px;margin:6px 0 16px}
label{font-size:13px;color:#aaa}
input{width:100%;padding:15px;border:1px solid #333;border-radius:14px;margin:6px 0 12px;background:#111;color:#fff;font-size:16px;outline:none}input:focus{border-color:#FFD400}
.btn{width:100%;padding:15px;border:none;border-radius:999px;font-weight:800;cursor:pointer;font-size:15px;margin-top:6px}.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}.btn-dark{background:#222;color:#fff}
.msg{padding:12px;border-radius:12px;font-size:13px;margin:10px 0;display:none;text-align:center}.msg.err{display:block;background:#FF2D0022;color:#FF6B6B;border:1px solid #FF2D00}
.links{text-align:center;margin-top:14px;font-size:13px;line-height:2}.links a{color:#FFD400;text-decoration:none}
@media(max-width:520px){body{padding:10px;align-items:flex-start}.box{padding:20px 16px;border-radius:22px;margin-top:20px}}
</style></head><body>
<div class="box"><div style="text-align:center;font-size:52px">🔑</div><h2>Karibu Tena</h2><p class="sub">Owner / Admin / Member — ingia uende kwenye Dashboard yako</p>
<label>Username</label><input id="u" placeholder="mfano: ali123" autocomplete="username">
<label>Password</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
<div id="msg" class="msg"></div><button class="btn btn-yellow" id="btn" onclick="doLogin()">Ingia →</button>
<button class="btn btn-dark" onclick="location.href='index.html'">← Nyumbani</button>
<div class="links"><a href="owner.html">Jisajili Owner</a> • <a href="register-member.html">Jisajili Member</a></div></div>
<script>
const API_URL='https://gym-groups.onrender.com';
async function doLogin(){
let b={username:document.getElementById('u').value.trim(),password:document.getElementById('p').value};
if(!b.username||!b.password){let e=document.getElementById('msg');e.textContent='Jaza username na password';e.className='msg err';return;}
document.getElementById('btn').textContent='⏳ Inaingia...';
try{let r=await fetch(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json();
if(d.success){localStorage.setItem('gym_user',JSON.stringify(d)); location.href='dashboard.html';}
else{let e=document.getElementById('msg');e.textContent='❌ '+d.message;e.className='msg err';}
}catch(e){let el=document.getElementById('msg');el.textContent='❌ Backend haijapatikana, subiri 30s jaribu tena';el.className='msg err';}
document.getElementById('btn').textContent='Ingia →';
}
document.getElementById('p').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
</script></body></html>
