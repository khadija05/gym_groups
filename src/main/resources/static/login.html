<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingia - GYM Zanzibar</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}body{background:#0B0B0F;color:#fff;padding:14px;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{max-width:460px;width:100%;background:#161616;border:1px solid #2A2A2A;padding:26px;border-radius:26px}.logo{text-align:center;font-size:28px;font-weight:900}.logo span{color:#FFD400}.sub{text-align:center;color:#888;font-size:13px;margin:6px 0 16px}input,select{width:100%;padding:13px;border:1px solid #333;border-radius:14px;margin:6px 0;background:#111;color:#fff}.btn{width:100%;padding:13px;border:none;border-radius:50px;font-weight:800;cursor:pointer}.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}.btn-orange{background:linear-gradient(135deg,#FF6B00,#FF2D00);color:#fff}.btn-owner{display:block;text-align:center;background:#FFD400;color:#000;padding:14px;border-radius:50px;font-weight:900;text-decoration:none;font-size:15px;margin:14px 0}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:11px;border-radius:50px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-weight:700}.tabs button.active{background:#FFD400;color:#000}.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.plan{border:2px solid #333;border-radius:14px;padding:10px;text-align:center;cursor:pointer;font-size:12px}.plan.sel{border-color:#FFD400;background:#FFD40011}.msg{padding:12px;border-radius:12px;font-size:13px;margin:10px 0;display:none;text-align:center}.msg.ok{display:block;background:#25D36622;color:#25D366;border:1px solid #25D366}.msg.err{display:block;background:#FF2D0022;color:#FF6B6B;border:1px solid #FF2D00}.modal{position:fixed;inset:0;background:#000C;display:none;align-items:center;justify-content:center;padding:14px;z-index:99}.modal.show{display:flex}.modal-box{background:#161616;border:1px solid #333;width:100%;max-width:420px;padding:24px;border-radius:24px;text-align:center}</style></head><body>
<div class="box">
<div class="logo">💪 GYM <span>ZANZIBAR</span></div><p class="sub">Ingia au Jisajili • Siku 3 Bure</p>

<!-- 👑 LINK YA OWNER IKO HAPA JUU KABISA - HAIOWEZI KUKOSEKANA -->
<a href="owner.html" style="display:block;text-align:center;background:#FFD400;color:#000;padding:14px;border-radius:50px;font-weight:900;text-decoration:none;font-size:15px;margin:14px 0">👑 OWNER - Jisajili Hapa →</a>
<p style="text-align:center;font-size:11px;color:#888;margin-top:-8px">Uki-click hapo juu unaenda Owner Register</p>

<div class="tabs"><button id="tLogin" class="active" onclick="show('login')">Ingia</button><button id="tReg" onclick="show('reg')">Jisajili</button></div>
<div id="pLogin"><input id="lUser" placeholder="Username au Simu"><input id="lPass" type="password" placeholder="Password"><div id="lMsg" class="msg"></div><button id="loginBtn" class="btn btn-yellow" onclick="login()">Ingia →</button>
<a href="owner.html" class="btn-owner" style="background:#222;color:#FFD400;border:1px solid #FFD400">👑 Mimi ni Owner →</a>
<button onclick="testBackend()" style="background:none;border:none;color:#FFD400;font-size:12px;width:100%;margin-top:8px;cursor:pointer">🔍 Pima Backend →</button></div>
<div id="pReg" style="display:none"><input id="rFull" placeholder="Jina Kamili"><input id="rUser" placeholder="Username"><input id="rPhone" placeholder="Simu 077..."><input id="rPass" type="password" placeholder="Password"><select id="rGroup"><option value="">Chagua Kikundi</option><option>Gym Stone Town - Jenga Mwili</option><option>Gym Mjini - Punguza Uzito</option><option>Gym Forodhani - Wanawake Tu</option><option>Gym Mjini Magharibi - Wanaume Tu</option></select><select id="rGoal"><option>Kujenga Mwili</option><option>Kupunguza Uzito</option><option>Kuwa na Afya</option><option>Kujenga Misuli</option></select><div class="plan-grid"><div class="plan sel" onclick="selectPlan('JARIBIO',this)"><b>🎁 JARIBIO</b>0 TZS</div><div class="plan" onclick="selectPlan('KIDOGO',this)"><b>💪 MWEZI</b>30,000</div><div class="plan" onclick="selectPlan('KUBWA',this)"><b>🏆 MWAKA</b>300,000</div></div><div id="rMsg" class="msg"></div><button id="regBtn" class="btn btn-orange" onclick="register()">Jisajili →</button></div>
<p style="text-align:center;font-size:12px;margin-top:12px"><a href="index.html" style="color:#FFD400">← Rudi Homepage</a></p></div>
<div class="modal" id="popupModal"><div class="modal-box"><div id="popupIcon" style="font-size:55px">✅</div><h3 id="popupTitle">Karibu!</h3><p id="popupMsg" style="color:#bbb;white-space:pre-line"></p><div id="popupAction"></div><button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="closePopup()">SAWA ✓</button></div></div>
<script>
const API_URL='https://gym-groups.onrender.com'; let selectedPlan='JARIBIO',isLoggingIn=false;
function showPopup(t,m,type='ok',a=''){document.getElementById('popupTitle').textContent=t;document.getElementById('popupMsg').textContent=m;document.getElementById('popupIcon').textContent=type==='ok'?'✅':type==='err'?'❌':type==='lock'?'🔒':'⏳';document.getElementById('popupAction').innerHTML=a;document.getElementById('popupModal').classList.add('show');}
function closePopup(){document.getElementById('popupModal').classList.remove('show');}
function showMsg(id,txt,ok=true){let el=document.getElementById(id);el.textContent=txt;el.className='msg '+(ok?'ok':'err');}
function show(t){document.getElementById('pLogin').style.display=t==='login'?'block':'none';document.getElementById('pReg').style.display=t==='reg'?'block':'none';document.getElementById('tLogin').classList.toggle('active',t==='login');document.getElementById('tReg').classList.toggle('active',t==='reg');}
function selectPlan(p,el){selectedPlan=p;document.querySelectorAll('.plan').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
async function testBackend(){ try{ let r=await fetch(API_URL+'/api/health'); let t=await r.text(); showPopup('✅ Backend Iko Hai!',t,'ok'); }catch(e){ showPopup('❌ Haijapatikana','Subiri sekunde 30 jaribu tena.','err'); } }
async function login(){ if(isLoggingIn) return; let u=document.getElementById('lUser').value.trim(); let p=document.getElementById('lPass').value; if(!u||!p){showMsg('lMsg','Jaza username na password.',false);return;} let btn=document.getElementById('loginBtn'); isLoggingIn=true; btn.disabled=true; btn.textContent='⏳ Inaingia...'; let isPhone=/^[0-9+]+$/.test(u); let b=isPhone?{phone:u,password:p}:{username:u,password:p,phone:u}; try{ let r=await fetch(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json(); if(d.success){ localStorage.setItem('gym_user',JSON.stringify(d)); if(d.role==='OWNER') location.href='owner.html'; else if(d.role==='ADMIN') location.href='admin.html'; else location.href='index.html'; return; } showPopup('Imeshindikana',d.message||d.error||'Login imeshindikana.','err'); }catch(e){ showPopup('❌ Backend Haijapatikana','Subiri sekunde 30 jaribu tena.','err'); } finally{ isLoggingIn=false; btn.disabled=false; btn.textContent='Ingia →'; } }
async function register(){ let btn=document.getElementById('regBtn'); btn.disabled=true; btn.textContent='⏳ Inajisajili...'; let b={name:document.getElementById('rFull').value.trim(),username:document.getElementById('rUser').value.trim(),phone:document.getElementById('rPhone').value.trim(),password:document.getElementById('rPass').value,role:'MEMBER',gymGroup:document.getElementById('rGroup').value,goal:document.getElementById('rGoal').value,plan:selectedPlan}; if(!b.username||!b.password||!b.phone){ showMsg('rMsg','Jaza username, simu na password.',false); btn.disabled=false; btn.textContent='Jisajili →'; return; } try{ let r=await fetch(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json(); if(d.success){ ['rFull','rUser','rPhone','rPass'].forEach(id=>document.getElementById(id).value=''); showPopup('✅ Umejisajili!','Subiri Admin akukubali.','ok'); setTimeout(()=>show('login'),1500); } else showMsg('rMsg',d.message||'Imeshindikana',false); }catch(e){ showMsg('rMsg','❌ Backend haijapatikana.',false); } btn.disabled=false; btn.textContent='Jisajili →'; }
</script></body></html>
