<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard - GYM Zanzibar</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}body{background:#0B0B0F;color:#fff}.top{position:sticky;top:0;z-index:20;background:#0B0B0FEE;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:19px;font-weight:900}.logo span{color:#FFD400}.btn{padding:10px 16px;border:none;border-radius:50px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}.btn-yellow{background:#FFD400;color:#000}.btn-green{background:#25D366;color:#fff}.btn-red{background:#FF2D00;color:#fff}.btn-dark{background:#222;color:#fff}.wrap{max-width:1100px;margin:0 auto;padding:14px}.welcome{background:linear-gradient(135deg,#FFD400,#FF6B00);color:#000;padding:18px;border-radius:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.stat{background:#161616;border:1px solid #2A2A2A;padding:16px;border-radius:18px;text-align:center}.stat b{font-size:26px;color:#FFD400;display:block}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tabs button{padding:11px 18px;border-radius:50px;border:1px solid #333;background:#161616;color:#fff;cursor:pointer;font-weight:700;white-space:nowrap}.tabs button.active{background:#FFD400;color:#000}.card{background:#161616;border:1px solid #2A2A2A;padding:16px;border-radius:20px;margin:12px 0}input,select{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #333;border-radius:12px;margin:6px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.member{background:#111;padding:13px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:4px 10px;border-radius:50px;font-size:11px;font-weight:800}.b-active{background:#25D36622;color:#25D366}.b-pending{background:#FFD40022;color:#FFD400}.b-locked{background:#FF2D0022;color:#FF2D00}.table-wrap{overflow-x:auto}.table-wrap table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px}.table-wrap th{text-align:left;color:#888;padding:10px;border-bottom:1px solid #333}.table-wrap td{padding:10px;border-bottom:1px solid #222}.empty{text-align:center;color:#888;padding:20px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.member{flex-direction:column;align-items:flex-start}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:20px}}</style></head><body>
<div class="top"><div class="logo">💪 GYM <span>ZANZIBAR</span> • Admin</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span id="adminNameTop" style="font-size:13px;color:#aaa;align-self:center"></span><a href="index.html" class="btn btn-dark">🏠 Home</a><button class="btn btn-yellow" onclick="loadAdmin()">🔄 Onyesha Upya</button><button class="btn btn-red" onclick="logout()">Toka</button></div></div>
<div class="wrap"><div class="welcome"><div><h2 id="hello">Karibu Admin 👋</h2><p id="adminGroup">Kikundi chako</p></div><div style="background:#0003;padding:10px 14px;border-radius:14px;text-align:center"><b id="todayCount" style="font-size:22px">0</b><br><span style="font-size:11px">Wamefika Leo</span></div></div>
<div class="stats"><div class="stat"><b id="sMembers">0</b><span>Member Wangu</span></div><div class="stat"><b id="sPending">0</b><span>Wanasubiri</span></div><div class="stat"><b id="sAmount">0</b><span>Jumla Pesa</span></div><div class="stat"><b id="sAttend">0</b><span>Mahudhurio</span></div></div>
<div class="tabs"><button id="tab-members" class="active" onclick="showTab('members')">👥 Member Wangu</button><button id="tab-payments" onclick="showTab('payments')">💰 Malipo</button><button id="tab-attend" onclick="showTab('attend')">✅ Mahudhurio</button><button id="tab-add" onclick="showTab('add')">➕ Sajili Member</button></div>
<div id="sec-members" class="card"><div class="row"><input id="q" placeholder="🔍 Tafuta jina / simu..." oninput="renderMembers()"><select id="fStatus" onchange="renderMembers()"><option value="">Status Zote</option><option value="active">Active</option><option value="pending">Pending</option><option value="locked">Locked</option></select></div><div id="memberList"></div></div>
<div id="sec-payments" class="card" style="display:none"><h3>💰 Malipo ya Member Wangu</h3><div class="table-wrap"><table><thead><tr><th>Member</th><th>Kiasi</th><th>Tarehe</th><th>Njia</th></tr></thead><tbody id="payList"></tbody></table></div><div id="payEmpty" class="empty" style="display:none">Hakuna malipo bado.</div></div>
<div id="sec-attend" class="card" style="display:none"><h3>✅ Mahudhurio ya Member Wangu</h3><div class="table-wrap"><table><thead><tr><th>Jina</th><th>Kikundi</th><th>Tarehe / Saa</th></tr></thead><tbody id="attList"></tbody></table></div><div id="attEmpty" class="empty" style="display:none">Hakuna mahudhurio bado.</div></div>
<div id="sec-add" class="card" style="display:none"><h3>➕ Sajili Member Mpya</h3><input id="mName" placeholder="Jina Kamili"><input id="mUser" placeholder="Username"><input id="mPhone" placeholder="Simu 077..."><input id="mPass" type="password" placeholder="Password"><select id="mGroup"><option>Gym Stone Town - Jenga Mwili</option><option>Gym Mjini - Punguza Uzito</option><option>Gym Forodhani - Wanawake Tu</option><option>Gym Mjini Magharibi - Wanaume Tu</option></select><select id="mPlan"><option value="KIDOGO">MWEZI - 30,000</option><option value="KUBWA">MWAKA - 300,000</option><option value="JARIBIO">JARIBIO - 0</option></select><button class="btn btn-green" style="width:100%" onclick="addMember()">➕ Sajili Member →</button><p id="addMsg" style="color:#FFD400;font-size:13px"></p></div>
</div>
<script>
const API_URL='https://gym-groups.onrender.com'; let admin=JSON.parse(localStorage.getItem('gym_user')||'null'); let data={members:[],payments:[],attendance:[]};
function showTab(t){ ['members','payments','attend','add'].forEach(x=>{ document.getElementById('sec-'+x).style.display=x===t?'block':'none'; document.getElementById('tab-'+x).classList.toggle('active',x===t); }); }
function logout(){ localStorage.removeItem('gym_user'); location.href='login.html'; }
async function loadAdmin(){
  if(!admin || (admin.role!=='ADMIN' && admin.role!=='OWNER')){ alert('Ingia kama Admin kwanza.'); location.href='login.html'; return; }
  if(admin.status==='locked'){
    document.body.innerHTML=`<div style="max-width:480px;margin:40px auto;background:#161616;padding:24px;border-radius:24px;text-align:center"><div style="font-size:60px">🔒</div><h2>Mfumo Umejifunga</h2><p style="color:#aaa;margin:10px 0">Ada yako ya mwezi imeisha. Lipa kwa Owner ili ufunguliwe.</p><div style="background:#FFF8E1;color:#222;padding:14px;border-radius:14px;text-align:left">🏦 PBZ • 0887387001 • KHADIJA DENGE<br>💰 Ada: <b>${(admin.monthlyFee||50000).toLocaleString()} TZS / Mwezi</b><br>📝 Reference: ${admin.username}</div><input id="payRef" placeholder="Namba ya Muamala" style="width:100%;padding:12px;margin:10px 0;border-radius:12px;background:#fff;color:#000"><button class="btn btn-green" style="width:100%;padding:13px;border:none;border-radius:50px;font-weight:800" onclick="payAdmin()">✅ Nimelipa - Tuma kwa Owner →</button></div>`;
    return;
  }
  document.getElementById('hello').textContent='Karibu '+(admin.name||admin.username)+' 👋'; document.getElementById('adminNameTop').textContent=admin.username+' • '+admin.role; document.getElementById('adminGroup').textContent=admin.gymGroup?'Kikundi: '+admin.gymGroup:'Member wako tu';
  try{ let r=await fetch(API_URL+'/api/admin/report?adminId='+admin.id); let d=await r.json(); if(d.success===false){ alert(d.message); return; } data.members=d.members||[]; data.payments=d.payments||[]; data.attendance=d.attendance||[]; document.getElementById('sMembers').textContent=d.totalMembers||0; document.getElementById('sPending').textContent=d.pendingMembers||0; document.getElementById('sAmount').textContent=(d.totalAmount||0).toLocaleString(); document.getElementById('sAttend').textContent=d.totalAttendance||0; document.getElementById('todayCount').textContent=d.todayAttendance||0; renderMembers(); renderPayments(); renderAttendance(); }catch(e){ alert('Backend haijapatikana. Subiri sekunde 30 jaribu tena.'); }
}
async function payAdmin(){ let ref=document.getElementById('payRef').value.trim(); if(!ref){alert('Weka namba ya muamala');return;} let r=await fetch(API_URL+'/api/owner/admin-pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminId:admin.id,reference:ref})}); let d=await r.json(); alert(d.message); location.href='login.html'; }
function renderMembers(){ let q=(document.getElementById('q').value||'').toLowerCase(); let f=document.getElementById('fStatus').value; let list=data.members.filter(m=>((m.name||'')+' '+(m.phone||'')+' '+(m.username||'')+' '+(m.gymGroup||'')).toLowerCase().includes(q) && (!f||m.status===f)); document.getElementById('memberList').innerHTML=list.length?list.map(m=>`<div class="member"><div><b>${m.name||m.username}</b> • ${m.phone||''}<br><span style="color:#aaa;font-size:12px">${m.gymGroup||''} • ${m.plan||''} • ${m.expiresAt?new Date(m.expiresAt).toLocaleDateString():''}</span> <span class="badge ${m.status==='active'?'b-active':m.status==='pending'?'b-pending':'b-locked'}">${m.status}</span></div><div style="display:flex;gap:6px"><button class="btn btn-green" onclick="act('approve',${m.id})">✅ Kubali</button><button class="btn btn-red" onclick="act('lock',${m.id})">🔒 Funga</button></div></div>`).join(''):'<div class="empty">Hakuna Member. Sajili kwenye tab ya ➕ Sajili Member.</div>'; }
function renderPayments(){ document.getElementById('payList').innerHTML=data.payments.map(p=>`<tr><td><b>${p.memberId||'-'}</b></td><td><b>${(p.amount||0).toLocaleString()} TZS</b></td><td>${p.paymentDate||''}</td><td>${p.method||''}</td></tr>`).join(''); document.getElementById('payEmpty').style.display=data.payments.length?'none':'block'; }
function renderAttendance(){ document.getElementById('attList').innerHTML=data.attendance.slice().reverse().map(a=>`<tr><td><b>${a.memberName||'Member '+a.memberId}</b></td><td>${a.groupName||''}</td><td>${a.checkIn?new Date(a.checkIn).toLocaleString('sw-TZ'):''}</td></tr>`).join(''); document.getElementById('attEmpty').style.display=data.attendance.length?'none':'block'; }
async function act(type,id){ await fetch(API_URL+'/api/auth/'+type+'/'+id,{method:'PUT'}); loadAdmin(); }
async function addMember(){ let b={adminId:admin.id,name:document.getElementById('mName').value.trim(),username:document.getElementById('mUser').value.trim(),phone:document.getElementById('mPhone').value.trim(),password:document.getElementById('mPass').value,gymGroup:document.getElementById('mGroup').value,plan:document.getElementById('mPlan').value}; if(!b.name||!b.username||!b.password){document.getElementById('addMsg').textContent='Jaza jina, username na password';return;} let r=await fetch(API_URL+'/api/admin/register-member',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json(); document.getElementById('addMsg').textContent=d.message||''; if(d.success){ ['mName','mUser','mPhone','mPass'].forEach(id=>document.getElementById(id).value=''); loadAdmin(); showTab('members'); } }
loadAdmin();
</script></body></html>
