<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingia - GYM Zanzibar</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}body{background:#0B0B0F;color:#fff;padding:14px;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{max-width:460px;width:100%;background:#161616;border:1px solid #2A2A2A;padding:26px;border-radius:26px}.logo{text-align:center;font-size:28px;font-weight:900}.logo span{color:#FFD400}.sub{text-align:center;color:#888;font-size:13px;margin:6px 0 16px}input,select{width:100%;padding:13px;border:1px solid #333;border-radius:14px;margin:6px 0;font-size:14px;background:#111;color:#fff;outline:none}input:focus{border-color:#FFD400}.btn{width:100%;padding:13px;border:none;border-radius:50px;font-weight:800;cursor:pointer;font-size:14px}.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}.btn-orange{background:linear-gradient(135deg,#FF6B00,#FF2D00);color:#fff}.btn:disabled{opacity:.6}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:11px;border-radius:50px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-weight:700}.tabs button.active{background:#FFD400;color:#000}.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.plan{border:2px solid #333;border-radius:14px;padding:10px;text-align:center;cursor:pointer;font-size:12px}.plan.sel{border-color:#FFD400;background:#FFD40011}.plan b{display:block;font-size:13px}.modal{position:fixed;inset:0;background:#000C;display:none;align-items:center;justify-content:center;z-index:99;padding:14px}.modal.show{display:flex}.modal-box{background:#161616;border:1px solid #333;width:100%;max-width:420px;padding:24px;border-radius:24px;text-align:center}</style></head><body>
<div class="box"><div class="logo">💪 GYM <span>ZANZIBAR</span></div><p class="sub">Ingia au Jisajili • Siku 3 Bure</p>
<div class="tabs"><button id="tLogin" class="active" onclick="show('login')">Ingia</button><button id="tReg" onclick="show('reg')">Jisajili</button></div>
<div id="pLogin"><input id="lUser" placeholder="Username au Simu"><input id="lPass" type="password" placeholder="Password"><button id="loginBtn" class="btn btn-yellow" onclick="login()">Ingia →</button><button onclick="testBackend()" style="background:none;border:none;color:#FFD400;font-size:12px;width:100%;margin-top:10px;cursor:pointer;font-weight:700">🔍 Pima kama Backend iko hai →</button><button onclick="logout()" style="background:none;border:none;color:#888;font-size:12px;width:100%;margin-top:4px;cursor:pointer">Toka / Futa Akaunti iliyohifadhiwa</button></div>
<div id="pReg" style="display:none"><input id="rFull" placeholder="Jina Kamili"><input id="rUser" placeholder="Username"><input id="rPhone" placeholder="Simu 077..."><input id="rPass" type="password" placeholder="Password"><select id="rGroup"><option value="">Chagua Kikundi (hiari)</option><option>Gym Stone Town - Jenga Mwili</option><option>Gym Mjini - Punguza Uzito</option><option>Gym Forodhani - Wanawake Tu</option><option>Gym Mjini Magharibi - Wanaume Tu</option></select><select id="rGoal"><option>Kujenga Mwili</option><option>Kupunguza Uzito</option><option>Kuwa na Afya</option><option>Kujenga Misuli</option></select><label style="font-size:13px;font-weight:700">💰 Chagua Kifurushi:</label><div class="plan-grid"><div class="plan sel" onclick="selectPlan('JARIBIO',this)"><b>🎁 JARIBIO</b>0 TZS<br>Siku 3</div><div class="plan" onclick="selectPlan('KIDOGO',this)"><b>💪 MWEZI</b>30,000<br>/ Mwezi</div><div class="plan" onclick="selectPlan('KUBWA',this)"><b>🏆 MWAKA</b>300,000<br>/ Mwaka</div></div><select id="rPlan" style="display:none"><option value="JARIBIO">JARIBIO</option><option value="KIDOGO">KIDOGO</option><option value="KUBWA">KUBWA</option></select><button id="regBtn" class="btn btn-orange" onclick="register()">Jisajili →</button><p style="font-size:11px;color:#888;text-align:center;margin-top:8px">Baada ya kujisajili, Mmiliki atakuthibitisha.</p></div>
<p style="text-align:center;font-size:12px;margin-top:12px"><a href="index.html" style="color:#FFD400">← Rudi Homepage</a></p></div>
<div class="modal" id="popupModal"><div class="modal-box"><div id="popupIcon" style="font-size:55px">✅</div><h3 id="popupTitle" style="margin:8px 0">Karibu!</h3><p id="popupMsg" style="font-size:14px;color:#bbb;line-height:1.6;white-space:pre-line"></p><div id="popupAction" style="margin-top:14px"></div><button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="closePopup()">SAWA ✓</button></div></div>
<script>
const API_URL='https://gymgroups.up.railway.app';
let selectedPlan='JARIBIO', isLoggingIn=false;
function showPopup(t,m,type='ok',a=''){ document.getElementById('popupTitle').textContent=t; document.getElementById('popupMsg').textContent=m; document.getElementById('popupIcon').textContent=type==='ok'?'✅':type==='err'?'❌':type==='lock'?'🔒':'⏳'; document.getElementById('popupAction').innerHTML=a; document.getElementById('popupModal').classList.add('show'); }
function closePopup(){ document.getElementById('popupModal').classList.remove('show'); }
function logout(){ localStorage.removeItem('gym_token'); localStorage.removeItem('gym_user'); showPopup('Umetoka','Umetoka. Ingia upya.','ok'); }
function show(t){ document.getElementById('pLogin').style.display=t==='login'?'block':'none'; document.getElementById('pReg').style.display=t==='reg'?'block':'none'; document.getElementById('tLogin').classList.toggle('active',t==='login'); document.getElementById('tReg').classList.toggle('active',t==='reg'); }
function selectPlan(p,el){ selectedPlan=p; document.getElementById('rPlan').value=p; document.querySelectorAll('.plan').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
async function testBackend(){
  showPopup('⏳ Inapima...','Inajaribu kuongea na Backend:\n'+API_URL,'wait');
  try{ let r=await fetch(API_URL+'/api/health'); let t=await r.text(); if(r.ok) showPopup('✅ Backend Iko Hai!','Backend inafanya kazi.\nJibu: '+t.substring(0,120),'ok'); else showPopup('⚠️ Backend Inajibu na Kosa','Status: '+r.status+'\n'+t.substring(0,200),'err'); }catch(e){ showPopup('❌ Backend Haijapatikana','Backend haijapatikana.\nKosa: '+e.message,'err'); }
}
async function fetchWithTimeout(url,opt,ms=30000){ let c=new AbortController(); let t=setTimeout(()=>c.abort(),ms); try{ let r=await fetch(url,{...opt,signal:c.signal}); clearTimeout(t); return r; }catch(e){ clearTimeout(t); throw e; } }
async function login(){
  if(isLoggingIn) return; let u=document.getElementById('lUser').value.trim(); let p=document.getElementById('lPass').value;
  if(!u||!p){ showPopup('Jaza Taarifa','Jaza username na password kwanza.','err'); return; }
  let btn=document.getElementById('loginBtn'); isLoggingIn=true; btn.disabled=true; btn.textContent='⏳ Inaingia...';
  localStorage.removeItem('gym_token'); localStorage.removeItem('gym_user');
  let isPhone=/^[0-9+]+$/.test(u); let b=isPhone?{phone:u,password:p,username:u}:{username:u,password:p,phone:u};
  try{
    let r=await fetchWithTimeout(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)},30000); let d=await r.json();
    if(d.success){ localStorage.setItem('gym_token','logged-in-'+Date.now()); localStorage.setItem('gym_user',JSON.stringify(d)); showPopup('Karibu '+(d.name||d.username)+'!','Umeingia vizuri. Karibu Gym Zanzibar 💪','ok','<button class="btn btn-yellow" style="width:100%" onclick="location.href=\'index.html\'">Nenda Homepage →</button>'); return; }
    if(d.error==='EXPIRED') showPopup('⏰ Muda Umeisha!','Mwezi wako umeisha bila kulipa. Lipa ili ufunguliwe tena.','lock');
    else if(d.error==='LOCKED') showPopup('🔒 Akaunti Imefungwa','Akaunti yako imefungwa. Lipa ili ufunguliwe.','lock');
    else if(d.error==='NOT_APPROVED') showPopup('⏳ Subiri Kuthibitishwa','Bado haijathibitishwa na Mmiliki. Subiri kidogo.','wait');
    else if(d.error==='NOT_FOUND') showPopup('Akaunti Haipo','Akaunti haipo. Jisajili kwanza.','err','<button class="btn btn-yellow" style="width:100%" onclick="closePopup();show(\'reg\')">🎁 Jisajili Sasa →</button>');
    else if(d.error==='WRONG_PASSWORD') showPopup('Password Si Sahihi','Password uliyoingiza si sahihi.','err');
    else showPopup('Imeshindikana',d.message||'Login imeshindikana.','err');
  }catch(e){ showPopup('❌ Backend Haijapatikana','Haiwezi kuongea na Backend.\nKosa: '+e.message,'err'); }
  finally{ isLoggingIn=false; btn.disabled=false; btn.textContent='Ingia →'; }
}
async function register(){
  let btn=document.getElementById('regBtn'); btn.disabled=true; btn.textContent='⏳ Inajisajili...';
  let b={name:document.getElementById('rFull').value.trim(),username:document.getElementById('rUser').value.trim(),phone:document.getElementById('rPhone').value.trim(),password:document.getElementById('rPass').value,role:'MEMBER',gymGroup:document.getElementById('rGroup').value,goal:document.getElementById('rGoal').value,plan:selectedPlan};
  if(!b.username||!b.password){ showPopup('Jaza Taarifa','Jaza username na password kwanza.','err'); btn.disabled=false; btn.textContent='Jisajili →'; return; }
  if(!b.phone){ showPopup('Jaza Namba','Jaza namba ya simu kwanza.','err'); btn.disabled=false; btn.textContent='Jisajili →'; return; }
  try{
    let r=await fetchWithTimeout(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)},30000); let d=await r.json();
    if(d.success){ showPopup('✅ Umejisajili!','Umejisajili vizuri kwa '+selectedPlan+'. Subiri Mmiliki akuthibitishe.','ok'); setTimeout(()=>show('login'),2000); }
    else showPopup('Imeshindikana',d.message||'Kujisajili kumeshindikana','err');
  }catch(e){ showPopup('❌ Backend Haijapatikana','Backend haijapatikana. Bonyeza Pima Backend.','err'); }
  btn.disabled=false; btn.textContent='Jisajili →';
}
</script></body></html>
