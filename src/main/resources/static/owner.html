<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner - GYM Zanzibar</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}body{background:#0B0B0F;color:#fff;padding:14px}.box{max-width:620px;margin:0 auto;background:#161616;border:1px solid #2A2A2A;padding:24px;border-radius:24px}input,select{width:100%;padding:13px;border:1px solid #333;border-radius:14px;margin:6px 0;background:#111;color:#fff}.btn{width:100%;padding:13px;border:none;border-radius:50px;font-weight:800;cursor:pointer;margin:4px 0}.btn-yellow{background:#FFD400}.btn-green{background:#25D366;color:#fff}.btn-red{background:#FF2D00;color:#fff}.card{background:#111;padding:14px;border-radius:16px;margin:10px 0}.stat{display:inline-block;background:#222;padding:14px 18px;border-radius:14px;margin:4px;text-align:center}.stat b{color:#FFD400;font-size:20px}@media(max-width:520px){.box{padding:16px}}</style></head><body>
<div class="box">
<div id="ownerRegister"><h2>👑 Jisajili kama OWNER</h2><p style="color:#888;font-size:13px">Wewe ndio Owner wa kwanza. Hakuna Owner mwingine ataweza kujisajili baada yako.</p><input id="oName" placeholder="Jina Kamili"><input id="oUser" placeholder="Username"><input id="oPhone" placeholder="Simu 088..."><input id="oPass" type="password" placeholder="Password"><button class="btn btn-yellow" onclick="registerOwner()">👑 Jisajili kama Owner →</button><p id="oMsg" style="font-size:13px;color:#FFD400"></p><p style="text-align:center"><a href="login.html" style="color:#FFD400">Tayari una akaunti? Ingia →</a></p></div>
<div id="ownerDash" style="display:none"><h2>👑 Dashboard ya Owner</h2><p id="ownerName" style="color:#aaa"></p><div id="stats"></div>
<h3 style="margin:14px 0 6px">➕ Sajili Admin Mpya</h3><div class="card"><input id="aName" placeholder="Jina la Admin"><input id="aUser" placeholder="Username ya Admin"><input id="aPhone" placeholder="Simu ya Admin"><input id="aPass" type="password" placeholder="Password ya Admin"><select id="aGroup"><option>Gym Stone Town - Jenga Mwili</option><option>Gym Mjini - Punguza Uzito</option><option>Gym Forodhani - Wanawake Tu</option><option>Gym Mjini Magharibi - Wanaume Tu</option></select><input id="aFee" type="number" value="50000" placeholder="Ada ya Mwezi (TZS)"><button class="btn btn-green" onclick="registerAdmin()">➕ Sajili Admin →</button><p id="aMsg" style="color:#FFD400;font-size:13px"></p></div>
<h3>💰 Ma-Admin Wangu na Malipo ya Mwezi</h3><div id="adminsReport"></div>
<h3>⏳ Malipo ya Admin Yanasubiri</h3><div id="pendingAdminPays"></div>
<h3>📊 Report Zote za Mfumo</h3><div id="reportList"></div>
<button class="btn btn-yellow" onclick="loadOwner()">🔄 Onyesha Upya</button><button class="btn btn-red" onclick="logout()">Toka</button>
</div></div>
<script>
const API_URL='https://gym-groups.onrender.com'; let owner=JSON.parse(localStorage.getItem('gym_user')||'null');
async function registerOwner(){
  let b={name:document.getElementById('oName').value.trim(),username:document.getElementById('oUser').value.trim(),phone:document.getElementById('oPhone').value.trim(),password:document.getElementById('oPass').value};
  if(!b.username||!b.password){document.getElementById('oMsg').textContent='Jaza username na password';return;}
  let r=await fetch(API_URL+'/api/auth/register-owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json();
  if(d.success){ localStorage.setItem('gym_user',JSON.stringify(d)); alert('Karibu Owner! Sasa ingia.'); location.href='login.html'; } else document.getElementById('oMsg').textContent=d.message;
}
async function registerAdmin(){
  let b={ownerId:owner.id,name:document.getElementById('aName').value.trim(),username:document.getElementById('aUser').value.trim(),phone:document.getElementById('aPhone').value.trim(),password:document.getElementById('aPass').value,gymGroup:document.getElementById('aGroup').value,monthlyFee:document.getElementById('aFee').value};
  if(!b.name||!b.username||!b.password){document.getElementById('aMsg').textContent='Jaza jina, username na password';return;}
  let r=await fetch(API_URL+'/api/auth/register-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json(); document.getElementById('aMsg').textContent=d.message||'';
  if(d.success){ ['aName','aUser','aPhone','aPass'].forEach(id=>document.getElementById(id).value=''); loadOwner(); }
}
async function approveAdminPay(id){ let r=await fetch(API_URL+'/api/owner/approve-admin-payment/'+id+'?ownerId='+owner.id,{method:'POST'}); let d=await r.json(); alert(d.message||'Imethibitishwa'); loadOwner(); }
async function loadOwner(){
  if(!owner || owner.role!=='OWNER'){ document.getElementById('ownerRegister').style.display='block'; return; }
  document.getElementById('ownerRegister').style.display='none'; document.getElementById('ownerDash').style.display='block';
  document.getElementById('ownerName').textContent='Karibu '+owner.name+' ('+owner.username+')';
  let r=await fetch(API_URL+'/api/owner/report?ownerId='+owner.id); let d=await r.json();
  document.getElementById('stats').innerHTML=`<div class="stat"><b>${d.totalUsers||0}</b><br>Watumiaji</div><div class="stat"><b>${d.totalAdmins||0}</b><br>Admin</div><div class="stat"><b>${d.totalMembers||0}</b><br>Members</div><div class="stat"><b>${(d.totalAmount||0).toLocaleString()}</b><br>Pesa</div><div class="stat"><b>${d.totalAttendance||0}</b><br>Mahudhurio</div>`;
  document.getElementById('reportList').innerHTML=`<div class="card">⏳ Wanasubiri: <b>${d.pendingMembers}</b><br>✅ Active: <b>${d.activeMembers}</b><br>💰 Malipo: <b>${d.totalPayments}</b> • TZS ${(d.totalAmount||0).toLocaleString()}<br>✅ Mahudhurio: <b>${d.totalAttendance}</b></div>`;
  let rr=await fetch(API_URL+'/api/owner/admins-report?ownerId='+owner.id); let dd=await rr.json();
  document.getElementById('adminsReport').innerHTML=(dd.admins||[]).map(a=>`<div class="card" style="border-left:4px solid ${a.isLocked?'#FF2D00':'#25D366'}"><b>${a.name}</b> • ${a.username} • ${a.group||''}<br><span style="font-size:12px;color:#aaa">Ada: ${(a.monthlyFee||0).toLocaleString()} TZS • Status: ${a.status} • Siku zilizobaki: <b style="color:${a.daysLeft<0?'#FF2D00':'#FFD400'}">${a.daysLeft}</b> • Member wake: ${a.membersCount}</span><br>${a.isLocked?'<span style="color:#FF2D00;font-weight:800">🔒 AMEJIFUNGA - HAJALIPA</span>':'<span style="color:#25D366">✅ Active</span>'}</div>`).join('')||'Hakuna Admin bado';
  document.getElementById('pendingAdminPays').innerHTML=(dd.pendingPayments||[]).map(p=>`<div class="card">💰 <b>${p.adminName}</b> • ${(p.amount||0).toLocaleString()} TZS • ${p.month} • Ref: ${p.reference}<br><button class="btn btn-green" onclick="approveAdminPay(${p.id})">✅ Thibitisha na Mfungulie →</button></div>`).join('')||'Hakuna malipo yanayosubiri';
}
function logout(){ localStorage.removeItem('gym_user'); location.reload(); }
loadOwner();
</script></body></html>
