<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner - GYM Zanzibar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}
body{background:#0B0B0F;color:#fff;padding:14px;background:radial-gradient(600px 300px at 50% 0%,rgba(255,212,0,.12),transparent),#0B0B0F}
.box{max-width:640px;margin:0 auto;background:#16161C;border:1px solid #2A2A32;padding:26px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
input,select{width:100%;padding:14px;border:1px solid #333;border-radius:14px;margin:6px 0;background:#111;color:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:#FFD400}
.btn{width:100%;padding:14px;border:none;border-radius:999px;font-weight:800;cursor:pointer;margin:4px 0;font-size:15px;transition:.2s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-yellow{background:linear-gradient(135deg,#FFD400,#FFAA00);color:#000}.btn-green{background:linear-gradient(135deg,#25D366,#00B84D);color:#fff}.btn-red{background:#FF2D00;color:#fff}.btn-dark{background:#222;color:#fff}
.card{background:#111;padding:16px;border-radius:18px;margin:10px 0;border:1px solid #26262E}
.stat{display:inline-block;background:#222;padding:14px 18px;border-radius:16px;margin:4px;text-align:center;min-width:105px;flex:1}.stat b{color:#FFD400;font-size:20px;display:block}
.msg{padding:12px;border-radius:12px;font-size:13px;margin:10px 0;display:none;text-align:center}.msg.ok{display:block;background:#25D36622;color:#25D366;border:1px solid #25D366}.msg.err{display:block;background:#FF2D0022;color:#FF6B6B;border:1px solid #FF2D00}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:99}.modal.show{display:flex}.modal-box{background:#1A1A22;border:1px solid #333;width:100%;max-width:420px;padding:24px;border-radius:26px;text-align:center}
@media(max-width:520px){body{padding:10px}.box{padding:18px 14px;border-radius:22px}.stat{min-width:0;padding:12px 8px}}
</style></head><body>
<div class="box">

<!-- REGISTER OWNER -->
<div id="ownerRegister">
<div style="text-align:center"><div style="font-size:52px">👑</div><h2>Jisajili kama OWNER</h2><p style="color:#888;font-size:13px;margin:6px 0 14px">Wewe ndio Owner wa kwanza. Hakuna Owner mwingine ataweza kujisajili baada yako.</p></div>
<input id="oName" placeholder="Jina Kamili">
<input id="oUser" placeholder="Username">
<input id="oPhone" placeholder="Simu 088...">
<input id="oPass" type="password" placeholder="Password">
<div id="oMsg" class="msg"></div>
<button id="oBtn" class="btn btn-yellow" onclick="registerOwner()">👑 Jisajili kama Owner →</button>
<p id="oStatus" style="text-align:center;font-size:12px;color:#888;margin-top:6px"></p>
<p style="text-align:center;margin-top:10px"><a href="login.html" style="color:#FFD400">Tayari una akaunti? Ingia →</a></p>
</div>

<!-- DASHBOARD -->
<div id="ownerDash" style="display:none">
<h2>👑 Dashboard ya Owner</h2>
<p id="ownerName" style="color:#aaa"></p>
<div id="stats" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0"></div>

<h3 style="margin:14px 0 6px">➕ Sajili Admin Mpya</h3>
<div class="card">
<input id="aName" placeholder="Jina la Admin">
<input id="aUser" placeholder="Username ya Admin">
<input id="aPhone" placeholder="Simu ya Admin">
<input id="aPass" type="password" placeholder="Password ya Admin">
<select id="aGroup">
<option>Gym Stone Town - Jenga Mwili</option>
<option>Gym Mjini - Punguza Uzito</option>
<option>Gym Forodhani - Wanawake Tu</option>
<option>Gym Mjini Magharibi - Wanaume Tu</option>
</select>
<input id="aFee" type="number" value="50000" placeholder="Ada ya Mwezi (TZS)">
<div id="aMsg" class="msg" style="display:block;min-height:20px"></div>
<button id="aBtn" class="btn btn-green" onclick="registerAdmin()">➕ Sajili Admin →</button>
<p id="aStatus" style="text-align:center;font-size:12px;color:#888;margin-top:6px"></p>
</div>

<h3>💰 Ma-Admin Wangu na Malipo ya Mwezi</h3>
<div id="adminsReport"></div>

<h3>⏳ Malipo ya Admin Yanasubiri</h3>
<div id="pendingAdminPays"></div>

<h3>📊 Report Zote za Mfumo</h3>
<div id="reportList"></div>

<button class="btn btn-yellow" onclick="loadOwner()">🔄 Onyesha Upya</button>
<button class="btn btn-red" onclick="logout()">Toka</button>
</div>

</div>

<!-- POPUP -->
<div class="modal" id="popupModal"><div class="modal-box"><div id="popupIcon" style="font-size:55px">✅</div><h3 id="popupTitle">Hongera!</h3><p id="popupMsg" style="color:#bbb;white-space:pre-line;margin:10px 0"></p><button class="btn btn-yellow" style="margin-top:12px" onclick="closePopup()">SAWA ✓</button></div></div>

<script>
const API_URL='https://gym-groups.onrender.com';
let owner=JSON.parse(localStorage.getItem('gym_user')||'null');

// POPUP + MSG - LAZIMA ZIWE HAPA JUU
function showPopup(t,m,icon='✅'){ document.getElementById('popupTitle').textContent=t; document.getElementById('popupMsg').textContent=m; document.getElementById('popupIcon').textContent=icon; document.getElementById('popupModal').classList.add('show'); }
function closePopup(){ document.getElementById('popupModal').classList.remove('show'); }
function showMsg(id,txt,ok=true){ let el=document.getElementById(id); el.textContent=txt; el.className='msg '+(ok?'ok':'err'); el.style.display='block'; }
function clearOwnerForm(){ ['oName','oUser','oPhone','oPass'].forEach(id=>document.getElementById(id).value=''); }
function clearAdminForm(){ ['aName','aUser','aPhone','aPass'].forEach(id=>document.getElementById(id).value=''); document.getElementById('aFee').value='50000'; }

// REGISTER OWNER - IMEFIXWA
async function registerOwner(){
  let btn=document.getElementById('oBtn');
  let statusEl=document.getElementById('oStatus');
  let b={ name:document.getElementById('oName').value.trim(), username:document.getElementById('oUser').value.trim(), phone:document.getElementById('oPhone').value.trim(), password:document.getElementById('oPass').value };
  if(!b.name||!b.username||!b.password){ showMsg('oMsg','⚠️ Jaza Jina, Username na Password!',false); showPopup('⚠️ Haijakamilika','Jaza Jina, Username na Password kwanza.','⚠️'); return; }
  if(b.password.length<4){ showMsg('oMsg','⚠️ Password iwe angalau herufi 4',false); return; }
  btn.disabled=true; btn.textContent='⏳ Inatuma... Subiri...'; statusEl.textContent='⏳ Inatuma...';
  try{
    let r=await fetch(API_URL+'/api/auth/register-owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    let d=await r.json();
    if(d.success){
      clearOwnerForm();
      showMsg('oMsg','✅ Umejisajili kama Owner! Karibu '+b.name,true);
      statusEl.textContent='✅ Amefanikiwa';
      showPopup('✅ Umefanikiwa!','Karibu Owner '+b.name+'!\nUsername: '+b.username+'\n\nSasa unaingia kwenye Login...','👑');
      localStorage.setItem('gym_user',JSON.stringify(d));
      setTimeout(()=>{ location.href='login.html'; },2000);
    } else {
      showMsg('oMsg','❌ '+(d.message||'Imeshindikana'),false);
      statusEl.textContent='❌ Imeshindikana';
      showPopup('❌ Imeshindikana', d.message||'Owner tayari yupo. Ingia kwa Login.','❌');
    }
  }catch(e){
    showMsg('oMsg','❌ Backend haijapatikana. Subiri sekunde 30 jaribu tena.',false);
    statusEl.textContent='❌ Backend haijapatikana';
    showPopup('❌ Backend Haijapatikana','Server imelala. Subiri sekunde 30 jaribu tena.\n\n'+e.message,'❌');
  }
  btn.disabled=false; btn.textContent='👑 Jisajili kama Owner →';
}

// REGISTER ADMIN - IMEFIXWA KABISA - SASA INALETA UJUMBE
async function registerAdmin(){
  let btn=document.getElementById('aBtn');
  let statusEl=document.getElementById('aStatus');
  let b={ ownerId:owner ? owner.id : null, name:document.getElementById('aName').value.trim(), username:document.getElementById('aUser').value.trim(), phone:document.getElementById('aPhone').value.trim(), password:document.getElementById('aPass').value, gymGroup:document.getElementById('aGroup').value, monthlyFee:document.getElementById('aFee').value };

  if(!owner){ showPopup('🔒 Ingia Kwanza','Ingia kama Owner kwanza ili usajili Admin.','🔒'); location.href='login.html'; return; }
  if(!b.name||!b.username||!b.password){
    showMsg('aMsg','⚠️ Jaza Jina, Username na Password!',false);
    showPopup('⚠️ Haijakamilika','Jaza Jina, Username na Password ya Admin kwanza.','⚠️');
    return;
  }
  if(b.password.length<4){ showMsg('aMsg','⚠️ Password iwe angalau herufi 4',false); return; }

  btn.disabled=true; btn.textContent='⏳ Inatuma... Subiri...'; statusEl.textContent='⏳ Inamtuma Admin kwa server...';
  showMsg('aMsg','⏳ Inatuma... subiri sekunde chache',true);

  try{
    console.log('Ninatuma Admin:', b);
    let r=await fetch(API_URL+'/api/auth/register-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    console.log('Status:', r.status);
    let d=await r.json();
    console.log('Majibu:', d);
    if(d.success){
      clearAdminForm();
      showMsg('aMsg','✅ Admin '+b.name+' amesajiliwa!',true);
      statusEl.textContent='✅ Amefanikiwa - Anaweza kuingia sasa';
      showPopup('✅ Admin Amesajiliwa!','Admin '+b.name+' ('+b.username+')\n\nGroup: '+b.gymGroup+'\nAda: '+b.monthlyFee+' TZS\n\nSasa anaweza kuingia kwa username na password yake.','✅');
      loadOwner();
    } else {
      showMsg('aMsg','❌ '+(d.message||'Imeshindikana'),false);
      statusEl.textContent='❌ Imeshindikana';
      showPopup('❌ Imeshindikana', d.message || 'Username au Simu hii tayari inatumika. Jaribu username nyingine.', '❌');
    }
  }catch(e){
    console.log('Error:', e);
    showMsg('aMsg','❌ Backend haijapatikana. Subiri sekunde 30 jaribu tena.',false);
    statusEl.textContent='❌ Backend haijapatikana';
    showPopup('❌ Backend Haijapatikana','Server imelala. Subiri sekunde 30, kisha jaribu tena.\n\nError: '+e.message,'❌');
  }
  btn.disabled=false; btn.textContent='➕ Sajili Admin →';
}

async function approveAdminPay(id){
  try{
    let r=await fetch(API_URL+'/api/owner/approve-admin-payment/'+id+'?ownerId='+owner.id,{method:'POST'});
    let d=await r.json();
    showPopup('✅ Imethibitishwa', d.message||'Imethibitishwa na Admin amefunguliwa.','✅');
    loadOwner();
  }catch(e){ showPopup('❌ Imeshindikana','Jaribu tena.','❌'); }
}

async function loadOwner(){
  if(!owner || owner.role!=='OWNER'){ document.getElementById('ownerRegister').style.display='block'; document.getElementById('ownerDash').style.display='none'; return; }
  document.getElementById('ownerRegister').style.display='none'; document.getElementById('ownerDash').style.display='block';
  document.getElementById('ownerName').textContent='Karibu '+owner.name+' ('+owner.username+') • '+owner.phone;
  try{
    let r=await fetch(API_URL+'/api/owner/report?ownerId='+owner.id);
    let d=await r.json();
    document.getElementById('stats').innerHTML=`<div class="stat"><b>${d.totalUsers||0}</b>Watumiaji</div><div class="stat"><b>${d.totalAdmins||0}</b>Admin</div><div class="stat"><b>${d.totalMembers||0}</b>Members</div><div class="stat"><b>${(d.totalAmount||0).toLocaleString()}</b>Pesa</div><div class="stat"><b>${d.totalAttendance||0}</b>Mahudhurio</div>`;
    document.getElementById('reportList').innerHTML=`<div class="card">⏳ Wanasubiri: <b>${d.pendingMembers}</b><br>✅ Active: <b>${d.activeMembers}</b><br>💰 Malipo: <b>${d.totalPayments}</b> • TZS ${(d.totalAmount||0).toLocaleString()}<br>✅ Mahudhurio: <b>${d.totalAttendance}</b></div>`;
    let rr=await fetch(API_URL+'/api/owner/admins-report?ownerId='+owner.id);
    let dd=await rr.json();
    document.getElementById('adminsReport').innerHTML=(dd.admins||[]).map(a=>`<div class="card" style="border-left:4px solid ${a.isLocked?'#FF2D00':'#25D366'}"><b>${a.name}</b> • ${a.username} • ${a.group||a.gymGroup||''}<br><span style="font-size:12px;color:#aaa">Ada: ${(a.monthlyFee||0).toLocaleString()} TZS • Status: ${a.status} • Siku zilizobaki: <b>${a.daysLeft}</b> • Member wake: ${a.membersCount}</span><br>${a.isLocked?'<span style="color:#FF2D00">🔒 AMEJIFUNGA - HAJALIPA</span>':'<span style="color:#25D366">✅ Active - Anaweza kuingia</span>'}</div>`).join('')||'<div class="card" style="text-align:center;color:#888">Hakuna Admin bado. Sajili wa kwanza hapo juu.</div>';
    document.getElementById('pendingAdminPays').innerHTML=(dd.pendingPayments||[]).map(p=>`<div class="card">💰 <b>${p.adminName}</b> • ${(p.amount||0).toLocaleString()} TZS • ${p.month} • Ref: ${p.reference}<br><button class="btn btn-green" onclick="approveAdminPay(${p.id})">✅ Thibitisha na Mfungulie →</button></div>`).join('')||'<div class="card" style="text-align:center;color:#888">Hakuna malipo yanayosubiri</div>';
  }catch(e){ console.log(e); }
}

function logout(){ localStorage.removeItem('gym_user'); location.reload(); }
loadOwner();
</script></body></html>
