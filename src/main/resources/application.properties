spring.application.name=gym-zanzibar
server.port=${PORT:8080}

# Database - Neon Postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-nameless-cake-bgc91lye-pooler.c-9.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Static files
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON
spring.jackson.serialization.fail-on-empty-beans=false
server.error.include-message=always
