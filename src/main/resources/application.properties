spring.application.name=gym-zanzibar
server.port=${PORT:10000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - SECURITY
jwt.secret=gym-zanzibar-siri-ndefu-sana-12345678901234567890-gym-zanzibar
jwt.expiration=28800000

# CORS - Ruhusu Vercel
app.frontend-url=https://gym-zanzibar.vercel.app
