spring.application.name=gym-zanzibar
server.port=${PORT:8080}

# Database - H2 File (data haipotei uki-deploy upya)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/gymdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Kama unatumia Postgres ya Railway, weka hizi kwenye Railway Variables:
# JDBC_DATABASE_URL=jdbc:postgresql://...
# Na ubadilishe hapo juu kuwa:
# spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:h2:file:./data/gymdb}}

# Static files
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON
spring.jackson.serialization.fail-on-empty-beans=false
server.error.include-message=always
